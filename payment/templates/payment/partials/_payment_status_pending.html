<div id="payment-status-container" 
     hx-get="{% url 'check-payment-status' order.order_id %}" 
     hx-trigger="every 3s" 
     hx-swap="outerHTML"
     class="text-center p-6 bg-blue-50 dark:bg-blue-900/20 rounded-xl border border-blue-200 dark:border-blue-800 animate-pulse">
    <div class="flex items-center justify-center space-x-3 text-blue-600 dark:text-blue-400">
        <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="font-body font-semibold">Order confirmed, waiting for payment confirmation...</span>
    </div>
    <p class="mt-2 text-sm text-blue-500 dark:text-blue-300 font-body">
        This will update automatically once Paystack confirms your transaction.
    </p>
</div>
