<div id="payment-status-container" 
     class="text-center p-6 bg-red-50 dark:bg-red-900/20 rounded-xl border border-red-200 dark:border-red-800">
    <div class="flex items-center justify-center space-x-3 text-red-600 dark:text-red-400">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span class="font-body font-bold text-lg">Payment Failed</span>
    </div>
    <p class="mt-2 text-sm text-red-500 dark:text-red-300 font-body">
        We couldn't confirm your payment. Please try again or contact support.
    </p>
    <div class="mt-6">
        <a href="{% url 'payment-retry' order.order_id %}" 
           class="inline-block bg-red-600 hover:bg-red-700 text-white font-body font-semibold py-2 px-6 rounded-lg transition duration-300">
            Retry Payment
        </a>
    </div>
</div>
