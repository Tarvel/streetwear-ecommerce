{% extends 'base.html' %} 
{% block title %}{{ product.name }}{% endblock %} 
{% block content %} 
{% load humanize %}

<section class="max-w-7xl mx-auto px-4 py-8 md:py-16">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-20">
    
    <!-- Left Column: Image Gallery (Lg: 7/12) -->
    <div class="lg:col-span-7 space-y-6">
      <!-- Main Image -->
      <div class="bg-gray-50 dark:bg-gray-900 rounded-xl overflow-hidden aspect-square flex items-center justify-center border border-gray-100 dark:border-gray-800">
        <img id="main-image"
             src="{% if product.image %}{{ product.image.url }}{% endif %}"
             alt="{{ product.name }}"
             class="w-full h-full object-cover transition-all duration-700 ease-in-out">
      </div>
      
      <!-- Thumbnails -->
      {% if product.additional_images.all %}
        <div class="flex flex-wrap gap-3">
          <div class="w-20 h-20 rounded-lg overflow-hidden cursor-pointer ring-2 ring-black dark:ring-white ring-offset-2 dark:ring-offset-gray-900 transition-all thumbnail-active"
               onclick="document.getElementById('main-image').src = '{{ product.image.url }}'; updateThumbnails(this);">
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-full h-full object-cover opacity-100 hover:opacity-100 transition-opacity">
          </div>
          {% for img in product.additional_images.all %}
            <div class="w-20 h-20 rounded-lg overflow-hidden cursor-pointer ring-1 ring-gray-200 dark:ring-gray-800 hover:ring-black dark:hover:ring-white transition-all"
                 onclick="document.getElementById('main-image').src = '{{ img.image.url }}'; updateThumbnails(this);">
              <img src="{{ img.image.url }}" alt="{{ product.name }}" class="w-full h-full object-cover opacity-60 hover:opacity-100 transition-opacity">
            </div>
          {% endfor %}
        </div>
      {% endif %}
    </div>

    <!-- Right Column: Product Info (Lg: 5/12) -->
    <div id="product-info-container" class="lg:col-span-5 flex flex-col pt-4 min-h-[500px]">
      {% include "products/_product_info.html" %}
    </div>
  </div>
</section>

<script>
  function incrementQuantity(id) {
    const input = document.getElementById(id);
    const max = parseInt(input.max);
    if (parseInt(input.value) < max) {
      input.value = parseInt(input.value) + 1;
    }
  }

  function decrementQuantity(id) {
    const input = document.getElementById(id);
    if (parseInt(input.value) > 1) {
      input.value = parseInt(input.value) - 1;
    }
  }

  function updateThumbnails(el) {
    // Remove active styles from all
    const parent = el.parentElement;
    const thumbs = parent.querySelectorAll('div');
    thumbs.forEach(t => {
      t.classList.remove('ring-2', 'ring-black', 'dark:ring-white', 'ring-offset-2', 'dark:ring-offset-gray-900', 'thumbnail-active');
      t.classList.add('ring-1', 'ring-gray-200', 'dark:ring-gray-800');
      t.querySelector('img').classList.replace('opacity-100', 'opacity-60');
    });
    
    // Add to clicked
    el.classList.add('ring-2', 'ring-black', 'dark:ring-white', 'ring-offset-2', 'dark:ring-offset-gray-900', 'thumbnail-active');
    el.classList.remove('ring-1', 'ring-gray-200', 'dark:ring-gray-800');
    el.querySelector('img').classList.replace('opacity-60', 'opacity-100');
  }
</script>

<style>
  /* Remove number input arrows */
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type=number] {
    -moz-appearance: textfield;
  }
</style>

{% endblock %}
